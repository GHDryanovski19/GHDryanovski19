name: nightly profile refresh

# Redraws every card from public GitHub and npm data and commits them when something changed.
# Needs no secrets: the built-in GITHUB_TOKEN only reads public data and lifts the rate limit.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "profile.json"

permissions:
  contents: write

concurrency:
  group: nightly-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: build
        run: python scripts/build.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md scripts/state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: nightly profile refresh"
            git push
          fi
      - name: Fail when a source went stale
        if: steps.build.outcome == 'failure'
        run: exit 1
